name: AnyTLS TCP preview (debug only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: AndroidLibXrayLite/go.mod
          cache-dependency-path: |
            AndroidLibXrayLite/go.sum
            native/anytlsbridge/go.sum
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - name: Install NDK
        run: |
          sdkmanager --channel=0 --install 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Validate overlay
        run: |
          python3 -m unittest discover -s native/tests -v
          bash -n native/build-anytls-aar.sh
          git diff --check
      - name: Build native libraries
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/
          bash native/build-anytls-aar.sh "$RUNNER_TEMP/anytls-core"
          cp "$RUNNER_TEMP/anytls-core/libv2ray.aar" V2rayNG/app/libs/
      - name: Test and assemble both debug distributions
        working-directory: V2rayNG
        run: |
          ./gradlew -PANYTLS_PREVIEW=true :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug :app:testFdroidDebugUnitTest :app:assembleFdroidDebug
      - name: Verify universal APK native packaging
        run: |
          python3 native/verify_apk.py V2rayNG/app/build/outputs/apk/*/debug/*universal*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: anytls-tcp-preview-debug
          path: V2rayNG/app/build/outputs/apk/*/debug/*.apk
          retention-days: 7
